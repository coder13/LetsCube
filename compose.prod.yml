x-app-build: &app-build
  context: .
  args:
    REACT_APP_API_ORIGIN: ${REACT_APP_API_ORIGIN:-}
    REACT_APP_SOCKETIO_ORIGIN: ${REACT_APP_SOCKETIO_ORIGIN:-}
    REACT_APP_WCA_ORIGIN: ${REACT_APP_WCA_ORIGIN:-https://www.worldcubeassociation.org}
    REACT_APP_WCA_CLIENT_ID: ${REACT_APP_WCA_CLIENT_ID:-}

x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  migrate:
    build: *app-build

  api:
    build: *app-build
    logging: *production-logging
    restart: unless-stopped

  socket:
    build: *app-build
    logging: *production-logging
    restart: unless-stopped

  postgres:
    logging: *production-logging
    restart: unless-stopped

  redis:
    logging: *production-logging
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      socket:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WWW_DIR:-/var/www/certbot}:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --no-check-certificate https://127.0.0.1/health/api || exit 1"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *production-logging
    restart: unless-stopped
